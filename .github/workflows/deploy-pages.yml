name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types, lint, formatting and unit tests
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify editor browser regressions
        run: npm run test:e2e

      - name: Build and verify production application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:production

      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare deployment credentials are missing.'
            exit 1
          fi

      - name: Prevent deployment of an outdated main commit
        run: |
          latest_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo '::error::This run is not the latest main commit. Deploy the latest main run instead.'
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=maps-editor --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.126.0

      - name: Verify anonymous editing and Google sign-in entry in production
        run: npm run test:production-auth
