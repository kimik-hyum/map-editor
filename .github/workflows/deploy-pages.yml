name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # PR E2E 및 package-lock.json의 Playwright 버전과 함께 갱신합니다.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host --init
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust and verify checkout for container Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
          git ls-remote --exit-code origin refs/heads/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types, lint, formatting and unit tests
        run: npm run verify

      - name: Verify editor browser regressions
        id: e2e
        run: npm run test:e2e

      - name: Upload failed browser regression artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-regressions
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify production application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:production

      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare deployment credentials are missing.'
            exit 1
          fi

      - name: Prevent deployment of an outdated main commit
        # 파이프 앞의 Git 조회 실패도 즉시 실패시켜 오래된 커밋으로 오인하지 않습니다.
        shell: bash
        run: |
          latest_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo '::error::This run is not the latest main commit. Deploy the latest main run instead.'
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=maps-editor --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.126.0

      - name: Verify anonymous editing and Google sign-in entry in production
        run: npm run test:production-auth
